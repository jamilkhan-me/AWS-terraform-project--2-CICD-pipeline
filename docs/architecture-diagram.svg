<svg width="700" height="640" viewBox="0 0 700 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>GitHub Actions to ECR to ECS Fargate CI/CD pipeline</title>
<desc>A developer pushes code to GitHub, which triggers a GitHub Actions workflow that assumes an AWS IAM role via OIDC with no static keys, builds a Docker image, pushes it to ECR, then deploys a new ECS Fargate task definition. Traffic flows from an internet-facing ALB to Fargate tasks running in private subnets inside a VPC.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="700" height="640" fill="#ffffff"/>

<rect x="40" y="20" width="180" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Developer</text>
<text x="130" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">git push to main</text>
<line x1="220" y1="45" x2="258" y2="45" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="260" y="20" width="220" height="50" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="370" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0C447C">GitHub Actions</text>
<text x="370" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">Build workflow triggered</text>
<line x1="370" y1="70" x2="370" y2="98" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="100" width="280" height="60" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="370" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">AWS IAM OIDC Role</text>
<text x="370" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Keyless auth - no static AWS keys in GitHub</text>
<line x1="370" y1="160" x2="370" y2="188" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="190" width="280" height="55" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="370" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#712B13">Build + Push Docker image</text>
<text x="370" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">Pushed to Amazon ECR</text>
<line x1="370" y1="245" x2="370" y2="273" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="275" width="280" height="55" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="370" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0C447C">Deploy new task definition</text>
<text x="370" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">ECS service updated, rolling deploy</text>
<line x1="370" y1="330" x2="370" y2="358" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="370" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Internet</text>
<line x1="370" y1="388" x2="370" y2="416" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="90" y="420" width="520" height="200" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="112" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">VPC</text>
<text x="112" y="468" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">eu-north-1</text>

<rect x="130" y="480" width="440" height="55" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="350" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0C447C">Public subnet - ALB</text>
<text x="350" y="521" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">Internet-facing, HTTP listener</text>

<line x1="350" y1="535" x2="350" y2="558" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="130" y="560" width="440" height="55" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="350" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#085041">Private subnet - ECS Fargate tasks</text>
<text x="350" y="601" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">2 tasks, awsvpc networking, no public IP</text>
</svg>
